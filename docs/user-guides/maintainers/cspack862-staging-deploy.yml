name: Validate and publish Pack staging site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the public source develop branch
        uses: actions/checkout@v6
        with:
          repository: CubScoutPack862/cspack862
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify local build
        run: npm run build
      - name: Verify project-path build
        run: npm run build
        env:
          BASE_PATH: /path-check/
          SITE_URL: https://example.invalid
      - name: Read staging Pages settings
        id: pages
        uses: actions/configure-pages@v5
      - name: Build staging artifact
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to staging GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
